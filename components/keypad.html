<div class="keypad">
  <div class="top_keypad-style">
    <div style="width: 15%"></div>
    <div id="keypad_title" class="keypad_title-style"></div>
    <button id="keypad_x_button" class="top_keypad_x_button-style">
      <img class="x_button-style" src="./assets/cross-mark-svgrepo-com.svg" alt="icon">
    </button>
  </div>

  <div class="keypad-row">
    <div id="keypad_display" class="display"></div>
  </div>
        
  <div class="keypad-row">
    <button id="keypad_1" class="keypad_btn-style" value="1">1</button>
    <button id="keypad_2" class="keypad_btn-style" value="2">2</button>
    <button id="keypad_3" class="keypad_btn-style" value="3">3</button>
  </div>
        
  <div class="keypad-row">
    <button id="keypad_4" class="keypad_btn-style" value="4">4</button>
    <button id="keypad_5" class="keypad_btn-style" value="5">5</button>
    <button id="keypad_6" class="keypad_btn-style" value="6">6</button>
  </div>
        
  <div class="keypad-row">
    <button id="keypad_7" class="keypad_btn-style" value="7">7</button>
    <button id="keypad_8" class="keypad_btn-style" value="8">8</button>
    <button id="keypad_9" class="keypad_btn-style" value="9">9</button>
  </div>
        
  <div class="keypad-row">
    <button id="keypad_canc" class="keypad_btn_invert-style">CANC</button>
    <button id="keypad_0" class="keypad_btn-style" value="0">0</button>
    <button id="keypad_ok" class="keypad_btn_invert-style">OK</button>
  </div>
</div>
